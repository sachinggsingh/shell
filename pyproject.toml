[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-shell"
version = "0.1.0"
description = "Developer shell with SSH-tunneled remote monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
tracing = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.scripts]
dev-shell = "dev_shell.cli:main"
dev_shell = "dev_shell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_shell = ["config/config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
